<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>730 días</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --fondo: #5c0f1f; }  /* cambiá este color para probar otros fondos (antes: #1e1148 violeta) */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Courier New", Courier, monospace; font-weight: bold; background: var(--fondo); }
  canvas, img { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* ---------- PANTALLA 1: corazón pixelado ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
    transition: opacity .6s ease .7s;
  }
  #heart {
    width: min(52vw, 280px); cursor: pointer;
    filter: drop-shadow(0 0 14px #ff3b5c) drop-shadow(0 0 40px #ff3b5c);
    animation: beat 1.8s ease-in-out infinite;
  }
  @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  #hint {
    color: #fff; font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; font-size: clamp(.8rem, 3.4vw, 1.1rem); text-shadow: 3px 3px 0 #3f3f3f;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #intro.open { opacity: 0; pointer-events: none; }
  #intro.open #hint { display: none; }
  .bit { position: fixed; z-index: 4; pointer-events: none; }

  /* ---------- PANTALLA 2 ---------- */
  #main {
    position: fixed; inset: 0; z-index: 1; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: none;
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  #main.show { opacity: 1; pointer-events: auto; }

  .float { position: absolute; bottom: -60px; animation: up linear infinite; opacity: .85; }
  @keyframes up { to { transform: translateY(-125vh); } }

  /* ---------- TEXTO (Press Start 2P de Google Fonts) ---------- */
  #titulo {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: .9em; font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal;
    font-size: clamp(1rem, 5.2vw, 2.4rem); text-transform: uppercase; line-height: 1;
  }
  .fila { display: flex; align-items: flex-end; justify-content: center; gap: .7em; }
  .tok {
    display: block; opacity: 0; transform: translateY(110vh);
    color: #fff;
    text-shadow: 0 .07em 0 #ff1f3d, .05em .07em 0 #ff1f3d, -.05em .07em 0 #ff1f3d;
  }
  .tok.b {
    font-size: 1.45em; color: #ff1f3d;
    text-shadow: 0 .05em 0 #fff, .04em .05em 0 #fff, -.04em .05em 0 #fff;
  }
  .medalla {
    font-size: .4em; padding: .7em 1em; margin-bottom: .6em; white-space: nowrap;
    color: #5a3a00; background: #f3c640; border: .22em solid #3a2500; border-radius: .7em;
    box-shadow: inset .2em .2em 0 #ffe27a, inset -.2em -.2em 0 #c8901a, 0 .22em 0 #fff;
    opacity: 0; transform: scale(.6);
  }
  #titulo.go .medalla { animation: pop .5s ease-out forwards; animation-delay: 4.7s; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  #botones {
    position: absolute; left: 0; right: 0; bottom: 9vh; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 1.1em;
    opacity: 0; pointer-events: none; transition: opacity .7s ease;
  }
  #botones.ver { opacity: 1; pointer-events: auto; }
  .btn {
    font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; text-transform: uppercase;
    font-size: clamp(.6rem, 2.8vw, .85rem); padding: 1.1em 1.4em; border-radius: .6em; cursor: pointer;
  }
  .btn:active { transform: translateY(.2em); }
  .btn.rojo { background: #d6284a; color: #ffe9ee; border: .2em solid #ff9db0; box-shadow: 0 .3em 0 #8a0f2c; }
  .btn.celeste { background: #ffe9ee; color: #ff1f3d; border: .2em solid #fff; box-shadow: 0 .3em 0 #ff9db0; }
  .btn.rojo:hover { background: #e6385a; }
  .btn.celeste:hover { background: #fff5f7; }
  #pantalla3 {
    position: fixed; inset: 0; z-index: 1; background: var(--fondo);
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  #pantalla3.show { opacity: 1; pointer-events: auto; }
  #titulo.go .tok { animation: sube 1.3s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: calc(var(--i) * .55s); }
  #titulo.pulse { animation: beat 1.8s ease-in-out infinite; }
  @keyframes sube {
    from { opacity: 1; transform: translateY(110vh); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- PLAN DE HOY (al tocar "Continuar sin ver") ---------- */
  #plan {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3.2em;
    padding: 0 16px; position: relative; z-index: 2;
  }
  #plan h2 {
    font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; text-transform: uppercase;
    font-size: clamp(1.3rem, 6.5vw, 2.8rem); line-height: 1.3; text-align: center; color: #fff;
    text-shadow: 0 .07em 0 #ff1f3d, .05em .07em 0 #ff1f3d, -.05em .07em 0 #ff1f3d;
    animation: sube 1.1s cubic-bezier(.2,.8,.3,1) both;   /* entra la frase entera desde abajo */
  }
  #plan h2.izq { animation: entraIzq 1.1s cubic-bezier(.2,.8,.3,1) both; }   /* las preguntas entran desde la izquierda */
  @keyframes entraIzq { from { opacity: 1; transform: translateX(-100vw); } to { opacity: 1; transform: translateX(0); } }
  #plan h2.pulse { animation: flota 2.6s ease-in-out infinite alternate; }   /* después flota suave */
  @keyframes flota { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  /* botones y solapas caen desde arriba con un rebotecito */
  @keyframes cae {
    0%   { opacity: 1; transform: translateY(-100vh); }
    65%  { opacity: 1; transform: translateY(14px); }
    82%  { opacity: 1; transform: translateY(-7px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  #plan .opciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6em; }
  #plan .btn { font-size: clamp(.8rem, 3.6vw, 1.1rem); padding: 1.2em 1.8em; opacity: 0; animation: cae .9s ease-out forwards;
    transition: transform .45s ease-out, left .45s ease-out, top .45s ease-out; }
  #plan .btn:nth-child(1) { animation-delay: 1.1s; }
  #plan .btn:nth-child(2) { animation-delay: 1.35s; }
  /* solapas de las preguntas (mismo estilo que las de las fotos) */
  #plan .tab.chica { font-size: clamp(.5rem, 2.2vw, .65rem); }   /* opciones chiquitas */
  #plan .tab { font-size: clamp(.65rem, 2.9vw, .95rem); opacity: 0; animation: cae .9s ease-out forwards;
    transition: transform .45s ease-out, left .45s ease-out, top .45s ease-out;
    animation-delay: calc(1.1s + var(--k) * .25s); }
  #plan .tab.activa { opacity: 1; }
  #plan.sale { opacity: 0; transition: opacity .45s ease; }
  #plan .huye { position: fixed; z-index: 5; }               /* el botón que se escapa (Plan A, Pastas) */
  #plan .gigante {                                           /* el botón que crece hasta ocupar la pantalla */
    display: flex; align-items: center; justify-content: center; gap: .5em;
    position: fixed; z-index: 20; margin: 0;
    transition: left .7s ease-in-out, top .7s ease-in-out, width .7s ease-in-out, height .7s ease-in-out,
                font-size .7s ease-in-out, border-radius .7s ease-in-out;
  }

  /* ---------- REPRODUCTOR DE MÚSICA (arriba de todo) ---------- */
  #musica { position: fixed; top: 0; left: 0; right: 0; z-index: 50; font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; color: #fff; }
  #mbar {
    height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px; cursor: pointer;
    background: #2b2b2b; border-bottom: 4px solid #000; box-shadow: inset 0 -4px 0 #555, inset 0 4px 0 #444;
  }
  #mart { width: 34px; height: 34px; border: 3px solid #000; background: #000; image-rendering: auto; object-fit: cover; flex: none; }
  #mart.suena { animation: rebota .6s steps(2) infinite; }
  @keyframes rebota { 50% { transform: translateY(-3px); } }
  #mtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #mnombre { font-size: .55rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-transform: uppercase; }
  #martista { font-size: .42rem; color: #aaa; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-transform: uppercase; }
  #mflecha { color: #aaa; font-size: .5rem; }
  #mpanel { display: none; background: #3b3b3b; border-bottom: 4px solid #000; padding: 12px; max-height: 70vh; overflow-y: auto; }
  #mpanel.abierto { display: block; }
  #mprog { height: 12px; background: #1a1a1a; border: 3px solid #000; margin-bottom: 12px; cursor: pointer; }
  #mfill { height: 100%; width: 0; background: #5d9c3f; }
  #mctrl { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .mbtn {
    font-family: inherit; font-size: .6rem; color: #fff; cursor: pointer; padding: .9em 1.1em;
    background: #7a7a7a; border: 3px solid #000; box-shadow: inset -4px -4px 0 #555, inset 4px 4px 0 #c6c6c6;
    text-transform: uppercase;
  }
  .mbtn:active { transform: translateY(2px); }
  .mbtn:disabled { opacity: .5; cursor: default; }
  #mlista { list-style: none; }
  #mlista li {
    display: flex; align-items: center; gap: 10px; padding: .6em; margin-bottom: 4px; cursor: pointer;
    background: #2b2b2b; border: 3px solid #000; font-size: .5rem; text-transform: uppercase;
  }
  #mlista li.actual { background: #3b6e22; }
  #mlista img { width: 36px; height: 36px; border: 2px solid #000; image-rendering: auto; flex: none; }
  #mlista .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #mlista .t span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #mlista .t span + span { font-size: .4rem; color: #bbb; }

  /* ---------- FLECHA DE VOLVER ---------- */
  .volver {
    position: fixed; top: 58px; left: 10px; z-index: 30; width: 44px; height: 36px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: #7a7a7a; border: 3px solid #000; box-shadow: inset -4px -4px 0 #555, inset 4px 4px 0 #c6c6c6;
    opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  .volver.ver { opacity: 1; pointer-events: auto; }
  .volver:active { transform: translateY(2px); }
  .volver svg { image-rendering: pixelated; filter: drop-shadow(2px 2px 0 #3f3f3f); }

  /* ---------- MODO HISTORIA ---------- */
  #pantalla3 { display: flex; flex-direction: column; padding-top: 52px; }
  #tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 44px 12px 6px; }
  .tab {
    font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; text-transform: uppercase;
    font-size: clamp(.5rem, 2.3vw, .7rem); padding: 1em 1.1em; cursor: pointer; color: #fff;
    background: #7a7a7a; border: 3px solid #000; text-shadow: 2px 2px 0 #3f3f3f;
    box-shadow: inset -4px -4px 0 #555, inset 4px 4px 0 #c6c6c6;
  }
  .tab { display: inline-flex; align-items: center; gap: .6em; }
  .tab .e { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-size: 1.5em; line-height: 1; text-shadow: none; }
  .tab:active { transform: translateY(2px); }
  .tab.activa { background: #5d9c3f; box-shadow: inset -4px -4px 0 #3b6e22, inset 4px 4px 0 #8fd35e; }
  #galeria {
    flex: 1; overflow-y: auto; padding: 22px 18px 40px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px; align-content: start;
  }
  .vacio { grid-column: 1 / -1; text-align: center; color: #fff; font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; font-size: .7rem; line-height: 1.8; padding-top: 12vh; }
  .item { cursor: pointer; transform: rotate(var(--r)); transition: transform .2s; animation: aparece .45s ease-out backwards; animation-delay: calc(var(--k) * 70ms); }
  .item:hover { transform: rotate(0deg) scale(1.05); }
  @keyframes aparece { from { opacity: 0; transform: translateY(40px) scale(.7) rotate(var(--r)); } }

  /* polaroid con estilo minecraft */
  .pol { position: relative; aspect-ratio: 5 / 6; perspective: 1200px; }
  .pol-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.4,.2,.2,1); }
  .pol-inner.flip { transform: rotateY(180deg); }
  .cara {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border: 4px solid #000; box-shadow: 0 6px 0 rgba(0,0,0,.5), inset 0 0 0 3px #fff;
    display: flex; flex-direction: column;
  }
  .frente { background: #f7f4ea; padding: 8% 8% 0; }
  .foto {
    flex: 1; min-height: 0; border: 3px solid #000; background: #2a2a40; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5em;
    font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; color: #8c8cb8; font-size: .5rem;
  }
  .foto .emo { font-size: 2.2rem; }
  .foto img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto; }
  .pie {
    height: 20%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 4px;
    font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; font-size: .45rem;
    color: #333; text-transform: uppercase; line-height: 1.5;
  }
  .dorso { transform: rotateY(180deg); background: #e9d9a6; padding: 9%; overflow: hidden; }
  .dorso h3 { font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; font-size: .6rem; color: #8a0f2c; text-transform: uppercase; line-height: 1.5; margin-bottom: .9em; }
  .dorso p { color: #3a2a10; font-size: 1rem; line-height: 1.4; overflow-y: auto; white-space: pre-wrap; }

  /* polaroid horizontal */
  .pol.h { aspect-ratio: 6 / 5; }
  .item.h { grid-column: span 2; }

  /* zoom */
  .visor {
    position: fixed; inset: 0; z-index: 40; background: rgba(30, 3, 10, .88);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding-top: 52px; opacity: 0; transition: opacity .35s;
  }
  .visor.on { opacity: 1; }
  .visor .pol { width: min(86vw, calc((100vh - 150px) * 5 / 6), 420px); cursor: pointer; }
  .visor .pol.h { width: min(92vw, calc((100vh - 150px) * 6 / 5), 560px); }
  .visor .foto img { object-fit: cover; }
  .visor .foto { font-size: .7rem; }
  .visor .pie { font-size: .7rem; }
  .visor .dorso h3 { font-size: .8rem; }
  .visor .dorso p { font-size: 1.1rem; }
  .visor-hint { color: #fff; font-family: "Press Start 2P", "Courier New", monospace; font-weight: normal; font-size: .5rem; text-align: center; line-height: 1.6; padding: 0 12px; }
  .cerrar {
    position: absolute; top: 64px; right: 14px; font-family: "Press Start 2P", monospace; font-size: .8rem; cursor: pointer;
    padding: .8em 1em; color: #ffe9ee; background: #d6284a; border: 3px solid #000; box-shadow: inset -4px -4px 0 #8a0f2c, inset 4px 4px 0 #ff9db0;
  }
</style>
</head>
<body>

<div id="main"></div>
<div id="pantalla3"></div>

<div id="intro">
  <canvas id="heart" width="13" height="11"></canvas>
  <div id="hint">Click to start.</div>
</div>

<button id="volver" class="volver" aria-label="Volver">
  <svg width="22" height="17" viewBox="0 0 9 7" shape-rendering="crispEdges" fill="#fff"><path d="M3 0h1v1H3zM2 1h2v1H2zM1 2h8v1H1zM0 3h9v1H0zM1 4h8v1H1zM2 5h2v1H2zM3 6h1v1H3z"/></svg>
</button>

<div id="musica">
  <div id="mbar">
    <img id="mart" alt="">
    <div id="mtxt"><div id="mnombre"></div><div id="martista"></div></div>
    <span id="mflecha">▼</span>
  </div>
  <div id="mpanel">
    <div id="mprog"><div id="mfill"></div></div>
    <div id="mctrl">
      <button class="mbtn" id="mprev">◀◀</button>
      <button class="mbtn" id="mplay">▶</button>
      <button class="mbtn" id="mnext">▶▶</button>
    </div>
    <ol id="mlista"></ol>
  </div>
</div>

<script>
  // ---- Dibujo de sprites pixelados a partir de mapas de texto ----
  const HEART = [
    ".DDDD...DDDD.",
    "DRRRRD.DRRRRD",
    "DRWWRRDRRRRRD",
    "DRWRRRRRRRRRD",
    "DRRRRRRRRRRRD",
    ".DRRRRRRRRRD.",
    "..DRRRRRRRD..",
    "...DRRRRRD...",
    "....DRRRD....",
    ".....DRD.....",
    "......D......"
  ];
  const COLORS = { R: '#ff3b5c', D: '#8a0f2c', W: '#ffd0d8' };

  const heart = document.getElementById('heart');
  const hctx = heart.getContext('2d');
  HEART.forEach((row, y) => [...row].forEach((c, x) => {
    if (COLORS[c]) { hctx.fillStyle = COLORS[c]; hctx.fillRect(x, y, 1, 1); }
  }));

  function sprite(map, color) {
    const c = document.createElement('canvas');
    c.width = map[0].length; c.height = map.length;
    const g = c.getContext('2d'); g.fillStyle = color;
    map.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') g.fillRect(x, y, 1, 1); }));
    return c.toDataURL();
  }
  const SMALL_HEART = [".RR.RR.", "RRRRRRR", "RRRRRRR", ".RRRRR.", "..RRR..", "...R..."];
  const STAR = ["..Y..", ".YYY.", "YYYYY", ".YYY.", "..Y.."];
  const sprites = [
    sprite(SMALL_HEART, '#ff3b5c'), sprite(SMALL_HEART, '#ff7ac8'), sprite(SMALL_HEART, '#ffffff'),
    sprite(STAR, '#ffe94a'), sprite(STAR, '#ffffff')
  ];

  // ---- Pantalla 2: corazones y estrellas flotando + texto ----
  const main = document.getElementById('main');

  for (let i = 0; i < 28; i++) {
    const img = document.createElement('img');
    img.className = 'float';
    img.src = sprites[Math.floor(Math.random() * sprites.length)];
    img.style.width = (9 + Math.floor(Math.random() * 6)) + 'px';
    img.style.left = Math.random() * 95 + 'vw';
    img.style.animationDuration = (16 + Math.random() * 12) + 's';
    img.style.animationDelay = (-Math.random() * 28) + 's';
    img.style.animationTimingFunction = 'linear';
    main.appendChild(img);
  }

  const titulo = document.createElement('h1');
  titulo.id = 'titulo';
  const FILAS = [
    [['¡', ''], ['Felices', '']],
    [['730', 'b'], ['días', 'b']],
    [['mi', ''], ['amor', ''], ['!', '']]
  ];
  const medalla = document.createElement('div');
  medalla.className = 'medalla';
  medalla.textContent = '★ Mission passed ★';
  titulo.appendChild(medalla);
  let n = 0;
  FILAS.forEach(fila => {
    const f = document.createElement('div');
    f.className = 'fila';
    fila.forEach(([t, cls]) => {
      const c = document.createElement('span');
      c.className = 'tok ' + cls;
      c.textContent = t;
      c.style.setProperty('--i', n++);
      f.appendChild(c);
    });
    titulo.appendChild(f);
  });
  main.appendChild(titulo);

  let navegando = false, pantalla = 'intro';   // pantalla: 'intro' | 'main' | 'p3'
  const tFlow = [];
  const volverBtn = document.getElementById('volver');

  const botones = document.createElement('div');
  botones.id = 'botones';
  [['VER MODO HISTORIA', 'rojo', 'historia'], ['CONTINUAR SIN VER', 'celeste', 'continuar']].forEach(([t, cls, modo]) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls;
    b.textContent = t;
    b.addEventListener('click', () => {
      if (navegando) return;
      navegando = true; pantalla = 'p3';
      const p3 = document.getElementById('pantalla3');
      p3.dataset.modo = modo;
      main.classList.remove('show');
      setTimeout(() => {
        p3.classList.add('show');
        if (modo === 'historia') armarHistoria();
        else armarPlan();
        navegando = false;
      }, 800);
    });
    botones.appendChild(b);
  });
  main.appendChild(botones);
  titulo.addEventListener('animationend', e => {
    if (e.target === titulo.querySelector('.fila:last-child .tok:last-child')) titulo.classList.add('pulse');
  });

  // ---- Al tocar el corazón: se rompe en bloques ----
  const intro = document.getElementById('intro');
  let opened = false;
  heart.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    iniciarMusica();
    const r = heart.getBoundingClientRect();
    const cell = r.width / 13;
    HEART.forEach((row, y) => [...row].forEach((ch, x) => {
      if (!COLORS[ch]) return;
      const b = document.createElement('div');
      b.className = 'bit';
      b.style.cssText = `left:${r.left + x * cell}px;top:${r.top + y * cell}px;width:${cell}px;height:${cell}px;background:${COLORS[ch]}`;
      document.body.appendChild(b);
      const dx = (x - 6) * (30 + Math.random() * 40) + (Math.random() - .5) * 80;
      const dy = (y - 5) * (30 + Math.random() * 40) + 300 + Math.random() * 300;
      b.animate(
        [{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
         { transform: `translate(${dx}px,${dy}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }],
        { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.4,1)', fill: 'forwards' }
      ).onfinish = () => b.remove();
    }));
    heart.style.visibility = 'hidden';
    intro.classList.add('open');
    tFlow.push(setTimeout(() => { main.classList.add('show'); titulo.classList.add('go'); pantalla = 'main'; volverBtn.classList.add('ver'); }, 1100));
    tFlow.push(setTimeout(() => botones.classList.add('ver'), 1100 + 5400));
  });

  // ---- Flecha de volver: historia -> título -> corazón ----
  volverBtn.addEventListener('click', () => {
    if (navegando) return;
    const p3 = document.getElementById('pantalla3');
    if (pantalla === 'p3') {
      navegando = true; pantalla = 'main';
      p3.classList.remove('show');
      setTimeout(() => { main.classList.add('show'); navegando = false; }, 800);
    } else if (pantalla === 'main') {
      navegando = true; pantalla = 'intro';
      tFlow.forEach(clearTimeout); tFlow.length = 0;
      volverBtn.classList.remove('ver');
      main.classList.remove('show');
      setTimeout(() => {
        titulo.classList.remove('go', 'pulse');
        botones.classList.remove('ver');
        heart.style.visibility = 'visible';
        intro.classList.remove('open');
        opened = false;
        navegando = false;
      }, 800);
    }
  });

  //  MÚSICA: playlist fija con archivos de la carpeta "musica/" (van junto a este HTML)
  //  >>> CAMBIÁ LAS CANCIONES ACÁ: nombre, artista, mp3 y portada <<<
  // =====================================================
  const CANCIONES = [
    { name: 'Risa',            artist: 'Babasónicos',                    url: 'musica/01-risa.mp3',          art: 'musica/01-risa.jpg' },
    { name: 'Wonderwall',      artist: 'Oasis',                          url: 'musica/02-wonderwall.mp3',    art: 'musica/02-wonderwall.jpg' },
    { name: 'Nosotros',        artist: 'Babasónicos',                    url: 'musica/04-nosotros.mp3',      art: 'musica/04-nosotros.jpg' },
    { name: 'El Trato',        artist: 'Cruzando el Charco & Coti',      url: 'musica/05-el-trato.mp3',      art: 'musica/05-el-trato.jpg' },
    { name: 'Hoy',             artist: 'Cruzando el Charco ft. Benja Amadeo', url: 'musica/06-hoy.mp3',      art: 'musica/06-hoy.jpg' },
    { name: 'Tu Nombre',       artist: 'Cruzando el Charco',             url: 'musica/08-tu-nombre.mp3',     art: 'musica/08-tu-nombre.jpg' },
    { name: 'Doctora II',      artist: 'Piti Fernández',                 url: 'musica/09-doctora-ii.mp3',    art: 'musica/09-doctora-ii.jpg' }
  ];
  const pistas = CANCIONES;
  let actual = pistas.length ? 0 : -1;
  const audio = new Audio();
  audio.preload = 'auto';
  if (actual === 0) audio.src = pistas[0].url;
  const $ = id => document.getElementById(id);

  // se llama dentro del toque en el corazón (el navegador exige un toque del usuario para sonar)
  let musicaIniciada = false;
  function iniciarMusica() {
    if (musicaIniciada || actual < 0) return;
    audio.play().then(() => { musicaIniciada = true; }).catch(() => {});
  }
  function renderMusica() {
    const suena = actual >= 0 && !audio.paused;
    const art = $('mart');
    if (actual >= 0) {
      $('mnombre').textContent = pistas[actual].name;
      $('martista').textContent = pistas[actual].artist;
      if (art.getAttribute('src') !== pistas[actual].art) art.src = pistas[actual].art;
      art.style.visibility = 'visible';
    } else {
      $('mnombre').textContent = 'Sin música';
      $('martista').textContent = '';
      art.style.visibility = 'hidden';
    }
    art.classList.toggle('suena', suena);
    $('mplay').textContent = suena ? '❚❚' : '▶';
    $('mprev').disabled = $('mnext').disabled = $('mplay').disabled = pistas.length === 0;
    const lista = $('mlista');
    lista.innerHTML = '';
    pistas.forEach((p, i) => {
      const li = document.createElement('li');
      if (i === actual) li.className = 'actual';
      const im = document.createElement('img'); im.src = p.art; im.alt = '';
      const t = document.createElement('div'); t.className = 't';
      const n1 = document.createElement('span'); n1.textContent = p.name;
      const n2 = document.createElement('span'); n2.textContent = p.artist;
      t.append(n1, n2);
      li.append(im, t);
      li.addEventListener('click', () => irA(i));
      lista.appendChild(li);
    });
  }
  function irA(i) {
    actual = i;
    audio.src = pistas[i].url;
    audio.play().catch(() => {});
    renderMusica();
  }
  function siguientePista() { if (pistas.length) irA((actual + 1) % pistas.length); }
  function anteriorPista() {
    if (!pistas.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    irA((actual - 1 + pistas.length) % pistas.length);
  }
  audio.addEventListener('ended', siguientePista);
  audio.addEventListener('play', renderMusica);
  audio.addEventListener('pause', renderMusica);
  audio.addEventListener('timeupdate', () => {
    $('mfill').style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%';
  });
  $('mprog').addEventListener('click', e => {
    if (!audio.duration) return;
    const r = $('mprog').getBoundingClientRect();
    audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
  });
  $('mbar').addEventListener('click', () => $('mpanel').classList.toggle('abierto'));
  $('mprev').addEventListener('click', anteriorPista);
  $('mnext').addEventListener('click', siguientePista);
  $('mplay').addEventListener('click', () => { if (actual < 0) return; audio.paused ? audio.play().catch(() => {}) : audio.pause(); });
  audio.addEventListener('error', () => { $('mnombre').textContent = 'No se pudo cargar'; });
  renderMusica();

  const CATS = [['destacados', 'Momentos destacados', '⭐'], ['memes', 'Memes', '😂'], ['mates', 'Mates', '🧉'], ['nosotros', 'Nosotros', '🌙']];
  let filtro = null;

  // Detecta solo si la foto es horizontal (ancho > alto). Para forzarlo: orient: 'h' o 'v' en FOTOS.
  function detectarOrientaciones() {
    FOTOS.forEach(it => {
      if (!it.src || it.orient) return;
      const im = new Image();
      im.onload = () => {
        if (im.naturalWidth > im.naturalHeight) {
          it.orient = 'h';
          if ($('galeria') && !visorActual) pintarGaleria();
        }
      };
      im.src = it.src;
    });
  }
  detectarOrientaciones();

  function crearPol(it, conDorso) {
    const pol = document.createElement('div');
    pol.className = 'pol' + (it.orient === 'h' ? ' h' : '');
    const inner = document.createElement('div');
    inner.className = 'pol-inner';
    const frente = document.createElement('div');
    frente.className = 'cara frente';
    const foto = document.createElement('div');
    foto.className = 'foto';
    const placeholder = () => {
      foto.innerHTML = '';
      const e = document.createElement('div'); e.className = 'emo';
      e.textContent = (CATS.find(c => c[0] === it.cat) || [0, 0, '📷'])[2];
      const t = document.createElement('div'); t.textContent = 'Tu foto acá';
      foto.append(e, t);
    };
    if (it.src) {
      const img = document.createElement('img');
      img.alt = it.titulo || '';
      img.onerror = placeholder;
      img.src = it.src;
      foto.appendChild(img);
    } else placeholder();
    const pie = document.createElement('div');
    pie.className = 'pie';
    pie.textContent = it.titulo || '';
    frente.append(foto, pie);
    inner.appendChild(frente);
    if (conDorso) {
      const dorso = document.createElement('div');
      dorso.className = 'cara dorso';
      const h = document.createElement('h3'); h.textContent = it.titulo || '';
      const p = document.createElement('p'); p.textContent = it.desc || '';
      dorso.append(h, p);
      inner.appendChild(dorso);
    }
    pol.appendChild(inner);
    return pol;
  }

  function armarHistoria() {
    const p3 = $('pantalla3');
    p3.innerHTML = '';
    const tabs = document.createElement('div');
    tabs.id = 'tabs';
    CATS.forEach(([cat, nombre, emoji]) => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.cat = cat;
      const t = document.createElement('span'); t.textContent = nombre;
      const e = document.createElement('span'); e.className = 'e'; e.textContent = emoji;
      b.append(t, e);
      b.addEventListener('click', () => { filtro = filtro === cat ? null : cat; pintarGaleria(); });
      tabs.appendChild(b);
    });
    const gal = document.createElement('div');
    gal.id = 'galeria';
    p3.append(tabs, gal);
    pintarGaleria();
  }

  function pintarGaleria() {
    document.querySelectorAll('#tabs .tab').forEach(b => b.classList.toggle('activa', b.dataset.cat === filtro));
    const gal = $('galeria');
    gal.scrollTop = 0;
    gal.innerHTML = '';
    const lista = FOTOS.filter(f => !filtro || f.cat === filtro);
    if (!lista.length) {
      const v = document.createElement('div');
      v.className = 'vacio';
      v.textContent = 'Todavía no hay fotos acá';
      gal.appendChild(v);
      return;
    }
    lista.forEach((it, k) => {
      const item = document.createElement('div');
      item.className = 'item' + (it.orient === 'h' ? ' h' : '');
      item.style.setProperty('--r', (((k * 5) % 7) - 3) * 0.8 + 'deg');
      item.style.setProperty('--k', Math.min(k, 20));
      item.appendChild(crearPol(it, false));
      item.addEventListener('click', () => abrirVisor(item, it));
      gal.appendChild(item);
    });
  }

  // =====================================================
  //  PLAN DE HOY: lo que aparece al tocar "Continuar sin ver"
  // =====================================================
  // =====================================================
  //  ESCAPE: "botonA" se escapa y se achica, "botonB" crece hasta ocupar la pantalla
  //  (se usa en Plan A / Plan B y en Pastas / Hamburguesa)
  // =====================================================
  function hacerEscapar(botonA, botonB) {
    const INTENTOS_MAXIMOS = 8;   // cantidad de intentos hasta que Plan B ocupa toda la pantalla
    let intentos = 0;
    let ultimoEscape = 0;
    let escalaB_actual = 1;
    function esquivar(e) {
      if (e) e.preventDefault();
      if (botonB.classList.contains('gigante')) return;
      const ahora = Date.now();
      if (ahora - ultimoEscape < 350) return;   // evita que cuente dos veces el mismo intento
      ultimoEscape = ahora;
      intentos++;
      [botonA, botonB].forEach(b => { b.style.animation = 'none'; b.style.opacity = '1'; });

      if (intentos >= INTENTOS_MAXIMOS) {
        botonA.style.transition = 'transform .4s ease-in';
        botonA.style.transform += ' scale(0)';   // Plan A desaparece achicándose
        // Plan B se estira suave desde donde está hasta cubrir toda la pantalla
        const r = botonB.getBoundingClientRect();
        const letraActual = parseFloat(getComputedStyle(botonB).fontSize) * escalaB_actual;
        botonB.style.transition = 'none';
        botonB.style.transform = 'none';
        botonB.style.left = r.left + 'px';
        botonB.style.top = r.top + 'px';
        botonB.style.width = r.width + 'px';
        botonB.style.height = r.height + 'px';
        botonB.style.fontSize = letraActual + 'px';
        botonB.classList.add('gigante');
        botonB.offsetWidth;   // fuerza al navegador a tomar el punto de partida
        botonB.style.transition = '';
        botonB.style.left = '0px';
        botonB.style.top = '52px';
        botonB.style.width = '100vw';
        botonB.style.height = 'calc(100vh - 52px)';
        // letra lo más grande posible sin que el texto se salga de la pantalla
        const letras = botonB.textContent.trim().length + 3;
        botonB.style.fontSize = Math.min(96, innerWidth * 0.95 / letras) + 'px';
        botonB.style.borderRadius = '0';
        return;
      }

      const escalaA = 1 - intentos * 0.09;   // Plan A se achica un 9% por intento
      const escalaB = 1 + intentos * 0.22;   // Plan B crece un 22% por intento
      escalaB_actual = escalaB;
      botonB.style.transform = `scale(${escalaB})`;

      const rectA = botonA.getBoundingClientRect();
      if (!botonA.classList.contains('huye')) {
        botonA.style.left = rectA.left + 'px';
        botonA.style.top = rectA.top + 'px';
        botonA.classList.add('huye');
        botonA.offsetWidth;   // fuerza al navegador a aplicar la posición antes de animar
      }
      // dónde va a quedar Plan B ya agrandado (para que Plan A no caiga encima)
      const rectB = botonB.getBoundingClientRect();
      const centroB_x = rectB.left + rectB.width / 2;
      const centroB_y = rectB.top + rectB.height / 2;
      const anchoB = botonB.offsetWidth * escalaB;
      const altoB = botonB.offsetHeight * escalaB;
      const margen = 12;
      const arriba = 64;   // debajo de la barra de música
      const xAnterior = parseFloat(botonA.style.left);
      const yAnterior = parseFloat(botonA.style.top);
      const saltoMinimo = Math.min(innerWidth, innerHeight) * 0.35;   // que se aleje bastante de donde estaba
      let x, y, pruebas = 0, pisaB, muyCerca;
      do {
        x = margen + Math.random() * (innerWidth - rectA.width - margen * 2);
        y = arriba + Math.random() * (innerHeight - rectA.height - arriba - margen);
        pisaB = x < centroB_x + anchoB / 2 + margen && x + rectA.width > centroB_x - anchoB / 2 - margen &&
                y < centroB_y + altoB / 2 + margen && y + rectA.height > centroB_y - altoB / 2 - margen;
        muyCerca = Math.hypot(x - xAnterior, y - yAnterior) < saltoMinimo;
        pruebas++;
      } while (pruebas < 60 && (pisaB || muyCerca));
      // ángulo torcido al azar, entre 12° y 40° para un lado o el otro
      const giro = (12 + Math.random() * 28) * (Math.random() < .5 ? -1 : 1);
      botonA.style.left = x + 'px';
      botonA.style.top = y + 'px';
      botonA.style.transform = `rotate(${giro}deg) scale(${escalaA})`;
    }
    botonA.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') esquivar(e); });
    botonA.addEventListener('pointerdown', esquivar);
    botonA.addEventListener('click', e => e.preventDefault());   // Plan A nunca se puede elegir 😏
  }

  let ronda = 0;   // cambia cada vez que se entra de nuevo; así se ignoran pasos viejos que quedaron pendientes
  function armarPlan() {
    ronda++;
    const p3 = $('pantalla3');
    p3.innerHTML = '';
    const plan = document.createElement('div');
    plan.id = 'plan';
    const h = tituloPixel('¿Plan de hoy?');

    const opciones = document.createElement('div');
    opciones.className = 'opciones';
    const botonA = document.createElement('button');
    botonA.className = 'btn rojo';
    botonA.textContent = 'Plan A';
    const botonB = document.createElement('button');
    botonB.className = 'btn celeste';
    botonB.textContent = 'Plan B';
    opciones.append(botonA, botonB);
    plan.append(h, opciones);

    hacerEscapar(botonA, botonB);   // Plan A se escapa, se achica, y Plan B crece
    botonB.addEventListener('click', () => elegirPlan('B'), { once: true });   // un solo toque cuenta (evita la pregunta duplicada)
    // mismos corazones y estrellas flotando que en la pantalla del título
    for (let i = 0; i < 28; i++) {
      const img = document.createElement('img');
      img.className = 'float';
      img.src = sprites[Math.floor(Math.random() * sprites.length)];
      img.style.width = (9 + Math.floor(Math.random() * 6)) + 'px';
      img.style.left = Math.random() * 95 + 'vw';
      img.style.animationDuration = (16 + Math.random() * 12) + 's';
      img.style.animationDelay = (-Math.random() * 28) + 's';
      p3.appendChild(img);
    }
    p3.appendChild(plan);
  }
  // Título rojo pixelado: entra desde abajo y después late
  function tituloPixel(texto) {
    const h = document.createElement('h2');
    h.textContent = texto;
    h.addEventListener('animationend', e => { if (e.animationName === 'sube' || e.animationName === 'entraIzq') h.classList.add('pulse'); });
    return h;
  }

  function elegirPlan(cual) {
    if (cual === 'B') { respuestas.length = 0; mostrarPregunta(0); }
  }

  // =====================================================
  //  PREGUNTAS DEL PLAN B (de a una por vez)
  //  >>> AGREGÁ O CAMBIÁ PREGUNTAS ACÁ: [texto de la solapa, emoji] <<<
  // =====================================================
  const PREGUNTAS = [
    // escapa: la opción que se escapa al querer tocarla · gana: la que crece hasta ocupar la pantalla
    { pregunta: '¿Comida de hoy?', opciones: [['Pastas', '🍝'], ['Hamburguesa', '🍔']], escapa: 'Pastas', gana: 'Hamburguesa', chica: true },
    { pregunta: '¿Bebida de hoy?', opciones: [['Aperol', '🍊'], ['Santa Julia', '🥂'], ['Gin', '🍸']] },
    { pregunta: '¿Plan de hoy?',   opciones: [['Vueltin', '🚗'], ['Peli', '🍿'], ['Serie', '📺']] }
  ];
  const respuestas = [];

  function mostrarPregunta(n) {
    const anterior = $('plan');
    const miRonda = ronda;
    if (anterior) {                       // la pantalla anterior se desvanece y después aparece la pregunta
      anterior.classList.add('sale');
      setTimeout(() => { anterior.remove(); armarPregunta(n, miRonda); }, 450);
    } else armarPregunta(n, miRonda);
  }

  function armarPregunta(n, miRonda) {
    const p3 = $('pantalla3');
    if (miRonda !== ronda || pantalla !== 'p3' || p3.dataset.modo !== 'continuar') return;   // ya salió de esta pantalla
    if (n >= PREGUNTAS.length) { terminarPreguntas(); return; }
    const { pregunta, opciones, escapa, gana, chica } = PREGUNTAS[n];
    let botonEscapa = null, botonGana = null;
    const plan = document.createElement('div');
    plan.id = 'plan';
    const h = tituloPixel(pregunta);
    h.classList.add('izq');
    const caja = document.createElement('div');
    caja.className = 'opciones';
    let elegida = false;
    opciones.forEach(([texto, emoji], k) => {
      const b = document.createElement('button');
      b.className = chica ? 'tab chica' : 'tab';
      b.style.setProperty('--k', k);
      const t = document.createElement('span'); t.textContent = texto;
      const e = document.createElement('span'); e.className = 'e'; e.textContent = emoji;
      b.append(t, e);
      if (texto === gana) botonGana = b;
      if (texto === escapa) {               // esta opción nunca se puede elegir: se escapa
        botonEscapa = b;
        caja.appendChild(b);
        return;
      }
      b.addEventListener('click', () => {
        if (elegida) return;
        elegida = true;
        b.classList.add('activa');           // se pone verde como la solapa elegida en las fotos
        respuestas[n] = texto;
        // después de medio segundo: la pregunta y las otras solapas se van a la izquierda,
        // la elegida se va a la derecha, y aparece la próxima pregunta
        setTimeout(() => {
          const otras = [h, ...caja.querySelectorAll('.tab:not(.activa)')];
          [...otras, b].forEach(el => {
            el.style.animation = 'none';
            el.style.opacity = '1';
            el.style.transition = 'transform .7s ease-in, opacity .7s ease-in';
          });
          plan.offsetWidth;   // fuerza al navegador a tomar el punto de partida
          otras.forEach(el => { el.style.transform = 'translateX(-100vw)'; el.style.opacity = '0'; });
          b.style.transform = 'translateX(100vw)';
          b.style.opacity = '0';
          setTimeout(() => { plan.remove(); armarPregunta(n + 1, miRonda); }, 750);
        }, 500);
      });
      caja.appendChild(b);
    });
    plan.append(h, caja);
    p3.appendChild(plan);
    if (botonEscapa && botonGana) hacerEscapar(botonEscapa, botonGana);
  }

  function terminarPreguntas() {
    // >>> ACÁ VA LO QUE PASA CUANDO RESPONDE TODAS LAS PREGUNTAS (todavía sin definir) <<<
    console.log('Respuestas:', respuestas);
  }

  // ---- Zoom + dar vuelta ----
  let visorActual = null;
  function transformEntre(t, f) {
    const dx = (t.left + t.width / 2) - (f.left + f.width / 2);
    const dy = (t.top + t.height / 2) - (f.top + f.height / 2);
    return `translate(${dx}px,${dy}px) scale(${t.width / f.width})`;
  }
  function abrirVisor(item, it) {
    if (visorActual) return;
    const visor = document.createElement('div');
    visor.className = 'visor';
    const cerrarBtn = document.createElement('button');
    cerrarBtn.className = 'cerrar';
    cerrarBtn.textContent = '✕';
    const escena = crearPol(it, true);
    const inner = escena.querySelector('.pol-inner');
    const hint = document.createElement('div');
    hint.className = 'visor-hint';
    hint.textContent = 'Tocá la foto para darla vuelta';
    visor.append(cerrarBtn, escena, hint);
    document.body.appendChild(visor);

    const thumb = item.querySelector('.pol').getBoundingClientRect();
    item.style.visibility = 'hidden';
    requestAnimationFrame(() => visor.classList.add('on'));
    escena.animate(
      [{ transform: transformEntre(thumb, escena.getBoundingClientRect()) }, { transform: 'none' }],
      { duration: 450, easing: 'cubic-bezier(.2,.8,.3,1)' }
    );

    let cerrando = false;
    function cerrar() {
      if (cerrando) return;
      cerrando = true;
      const estabaVuelta = inner.classList.contains('flip');
      if (estabaVuelta) inner.classList.remove('flip');
      setTimeout(() => {
        const destino = item.querySelector('.pol').getBoundingClientRect();
        visor.classList.remove('on');
        escena.animate(
          [{ transform: 'none' }, { transform: transformEntre(destino, escena.getBoundingClientRect()) }],
          { duration: 350, easing: 'ease-in', fill: 'forwards' }
        ).onfinish = () => { visor.remove(); item.style.visibility = ''; visorActual = null; };
      }, estabaVuelta ? 450 : 0);
    }
    escena.addEventListener('click', e => { e.stopPropagation(); if (!cerrando) inner.classList.toggle('flip'); });
    cerrarBtn.addEventListener('click', e => { e.stopPropagation(); cerrar(); });
    visor.addEventListener('click', e => { if (e.target === visor || e.target === hint) cerrar(); });
    visorActual = { cerrar };
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && visorActual) visorActual.cerrar(); });
</script>
</body>
